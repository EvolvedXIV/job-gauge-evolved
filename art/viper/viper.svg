<?xml version="1.0" encoding="UTF-8"?>
<!--
  Job Gauge Evolved - Viper gauge art (original artwork, modelled on the game's Vipersight and Serpent Offerings
  gauges combined into one twinblade).

  A straight sword points out to each side; their hilts meet in the middle, where the grip is the Serpent
  Offerings vessel (liquid inside, tribute gems on top, Rattling Coils below).

  Gauge units: 320 x 100; the gauge's centre is (160, 58). At 100% size one unit is one pixel.
  Each <g data-layer="..."> is rendered to its own PNG by scripts/render_art.js:
    data-kind="color"  drawn as is
    data-kind="mask"   white/grey, multiplied by a colour setting at draw time
  Layers marked data-slot are drawn once per gem/coil, moved from their reference slot (see #anchors).
  The right blade is the left one mirrored around x = 160; everything else is drawn whole.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100">
  <defs>
    <filter id="blur2" filterUnits="userSpaceOnUse" x="-60" y="-60" width="440" height="220">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur4" filterUnits="userSpaceOnUse" x="-60" y="-60" width="440" height="220">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur7" filterUnits="userSpaceOnUse" x="-60" y="-60" width="440" height="220">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-60" y="-60" width="440" height="220">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>

    <!-- Left blade: straight, double-edged, clip-point tip at the far left, base against the guard. -->
    <path id="blade" d="M98 48 L30 48 Q16 50.5 4 58 Q16 65.5 30 68 L98 68 Z"/>
    <path id="bladeUpper" d="M98 48 L30 48 Q16 50.5 4 58 L98 58 Z"/>
    <path id="bladeLower" d="M4 58 Q16 65.5 30 68 L98 68 L98 58 Z"/>

    <!-- Hilt: a guard at each end of the grip; the grip is the vessel. -->
    <path id="guardL" d="M102 34 L108 42 L108 74 L102 82 L96 74 L96 42 Z"/>
    <path id="guardR" d="M218 34 L224 42 L224 74 L218 82 L212 74 L212 42 Z"/>
    <rect id="grip" x="107" y="45" width="106" height="26" rx="5"/>
    <rect id="gripInner" x="111" y="49" width="98" height="18" rx="3"/>
    <clipPath id="innerClip"><use href="#gripInner"/></clipPath>
    <path id="hiltOutline" d="M102 34 L108 42 L108 45 L212 45 L212 42 L218 34 L224 42 L224 74 L218 82 L212 74 L212 71 L108 71 L108 74 L102 82 L96 74 L96 42 Z"/>

    <!-- Gems and coils, at their reference slots. -->
    <path id="gemSocket" d="M160 25 L168 34 L160 43 L152 34 Z"/>
    <path id="gemStone" d="M160 27.5 L165.8 34 L160 40.5 L154.2 34 Z"/>
    <path id="coilSocket" d="M160 76 L166.5 83 L160 90 L153.5 83 Z"/>
    <path id="coilStone" d="M160 78.4 L164.3 83 L160 87.6 L155.7 83 Z"/>

    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="48" x2="0" y2="68">
      <stop offset="0" stop-color="#c9d2de"/>
      <stop offset="0.3" stop-color="#f5f9fd"/>
      <stop offset="0.5" stop-color="#d9e0ea"/>
      <stop offset="0.52" stop-color="#8e99a8"/>
      <stop offset="0.8" stop-color="#5d6776"/>
      <stop offset="1" stop-color="#3c4350"/>
    </linearGradient>
    <linearGradient id="tipFade" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="98" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2dc98"/>
      <stop offset="0.45" stop-color="#b98a3a"/>
      <stop offset="1" stop-color="#5e4215"/>
    </linearGradient>
    <linearGradient id="goldSide" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e4f1a"/>
      <stop offset="0.5" stop-color="#e9cf86"/>
      <stop offset="1" stop-color="#6e4f1a"/>
    </linearGradient>
    <linearGradient id="gripMetal" gradientUnits="userSpaceOnUse" x1="0" y1="45" x2="0" y2="71">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="0.5" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="vesselBack" gradientUnits="userSpaceOnUse" x1="0" y1="49" x2="0" y2="67">
      <stop offset="0" stop-color="#02040a"/>
      <stop offset="0.5" stop-color="#0b1428"/>
      <stop offset="1" stop-color="#050910"/>
    </linearGradient>
    <linearGradient id="liquidShade" gradientUnits="userSpaceOnUse" x1="0" y1="49" x2="0" y2="67">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#eeeeee"/>
      <stop offset="0.55" stop-color="#bababa"/>
      <stop offset="1" stop-color="#7a7a7a"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset="0.6" stop-color="#a3141a"/>
      <stop offset="1" stop-color="#3a0507"/>
    </radialGradient>
  </defs>

  <!-- Reference points for the plugin; never drawn. -->
  <g id="anchors" display="none">
    <circle id="anchor-centre" cx="160" cy="58" r="0"/>
    <circle id="anchor-gem" cx="160" cy="34" r="0" data-spacing="18"/>
    <circle id="anchor-coil" cx="160" cy="83" r="0" data-spacing="16"/>
    <circle id="anchor-value" cx="160" cy="58" r="0" data-height="14"/>
    <circle id="anchor-timer" cx="160" cy="15" r="0" data-height="13"/>
    <rect id="anchor-liquid" x="111" y="49" width="98" height="18"/>
  </g>

  <!-- ===== Left blade (the right one is mirrored) ===== -->
  <g data-layer="blade-halo" data-kind="mask">
    <use href="#blade" fill="#fff" filter="url(#blur7)" opacity="0.8"/>
    <use href="#blade" fill="#fff" filter="url(#blur2)"/>
  </g>

  <g data-layer="blade-base" data-kind="color">
    <use href="#blade" fill="url(#steel)"/>
    <use href="#blade" fill="url(#tipFade)"/>
    <!-- Central ridge and fuller. -->
    <path d="M10 58 L96 58" stroke="#ffffff" stroke-width="0.7" opacity="0.7"/>
    <rect x="34" y="56.2" width="56" height="3.2" rx="1.6" fill="#2b323d" opacity="0.85"/>
    <rect x="34" y="57.9" width="56" height="0.9" rx="0.45" fill="#dfe6ef" opacity="0.6"/>
    <!-- Bright edges. -->
    <path d="M98 49 L30 49 Q17 51.3 6 58" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.9"/>
    <path d="M6 58 Q17 64.7 30 67 L98 67" fill="none" stroke="#aab4c2" stroke-width="0.8" opacity="0.7"/>
    <!-- Ricasso with serpent scales next to the guard. -->
    <rect x="86" y="48" width="12" height="20" fill="#1c2129" opacity="0.55"/>
    <g fill="none" stroke="#c9a24c" stroke-width="0.8" opacity="0.9">
      <path d="M88 52 q2.5 2.5 5 0"/><path d="M88 57 q2.5 2.5 5 0"/><path d="M88 62 q2.5 2.5 5 0"/>
    </g>
    <use href="#blade" fill="none" stroke="#07090d" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <g data-layer="blade-tint" data-kind="mask">
    <use href="#bladeUpper" fill="#fff" opacity="0.5"/>
    <use href="#bladeLower" fill="#fff" opacity="0.38"/>
    <use href="#blade" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M10 58 L96 58" stroke="#fff" stroke-width="1.2" opacity="0.8" filter="url(#soft)"/>
  </g>

  <!-- ===== Hilt and Serpent Offerings vessel ===== -->
  <g data-layer="vessel-halo" data-kind="mask">
    <use href="#hiltOutline" fill="#fff" filter="url(#blur7)" opacity="0.8"/>
    <use href="#hiltOutline" fill="none" stroke="#fff" stroke-width="3" filter="url(#blur2)"/>
  </g>

  <g data-layer="vessel-back" data-kind="color">
    <use href="#gripInner" fill="url(#vesselBack)"/>
    <use href="#gripInner" fill="none" stroke="#000" stroke-width="2.4" opacity="0.6" clip-path="url(#innerClip)"/>
  </g>

  <g data-layer="liquid" data-kind="mask">
    <g clip-path="url(#innerClip)">
      <use href="#gripInner" fill="url(#liquidShade)"/>
      <rect x="111" y="50.5" width="98" height="1.8" fill="#fff" opacity="0.75" filter="url(#soft)"/>
      <g fill="#fff" opacity="0.35">
        <circle cx="118" cy="62" r="1.1"/><circle cx="129" cy="56" r="0.8"/><circle cx="140" cy="63" r="1"/>
        <circle cx="151" cy="57" r="0.7"/><circle cx="163" cy="62" r="1.1"/><circle cx="174" cy="55.5" r="0.8"/>
        <circle cx="186" cy="61.5" r="1"/><circle cx="197" cy="56.5" r="0.7"/><circle cx="205" cy="62.5" r="0.9"/>
      </g>
    </g>
  </g>

  <!-- The liquid's leading edge, drawn where the fill ends (reference at x = 160). -->
  <g data-layer="liquid-edge" data-kind="mask">
    <path d="M158 49 C161.5 52 156.5 55 159.5 58 C162.5 61 157.5 64 160 67 L162.6 67 C160.1 64 165.1 61 162.1 58 C159.1 55 164.1 52 160.6 49 Z"
          fill="#fff" filter="url(#soft)" opacity="0.9"/>
  </g>

  <g data-layer="vessel-frame" data-kind="color">
    <!-- Rails the gems sit on and the coils hang from. -->
    <rect x="118" y="41" width="84" height="5" rx="2.5" fill="#0c0905"/>
    <rect x="119" y="42" width="82" height="3" rx="1.5" fill="url(#gold)"/>
    <rect x="140" y="70" width="40" height="5" rx="2.5" fill="#0c0905"/>
    <rect x="141" y="71" width="38" height="3" rx="1.5" fill="url(#gold)"/>
    <!-- Grip frame around the vessel window. -->
    <path fill-rule="evenodd" fill="url(#gripMetal)"
          d="M112 45 H208 Q213 45 213 50 V66 Q213 71 208 71 H112 Q107 71 107 66 V50 Q107 45 112 45 Z
             M114 49 H206 Q209 49 209 52 V64 Q209 67 206 67 H114 Q111 67 111 64 V52 Q111 49 114 49 Z"/>
    <use href="#grip" fill="none" stroke="#06070a" stroke-width="1.4"/>
    <use href="#gripInner" fill="none" stroke="url(#gold)" stroke-width="1.3"/>
    <rect x="108" y="45.8" width="104" height="0.8" rx="0.4" fill="#ffffff" opacity="0.18"/>
    <!-- Half-way mark (50, enough to Reawaken). -->
    <path d="M160 44.5 L162.6 48 L160 51.5 L157.4 48 Z" fill="url(#gold)" stroke="#0c0905" stroke-width="0.8"/>
    <path d="M160 64.5 L162.6 68 L160 71.5 L157.4 68 Z" fill="url(#gold)" stroke="#0c0905" stroke-width="0.8"/>
    <!-- Guards, each with a serpent's eye. -->
    <use href="#guardL" fill="url(#goldSide)" stroke="#0c0905" stroke-width="1.4" stroke-linejoin="round"/>
    <use href="#guardR" fill="url(#goldSide)" stroke="#0c0905" stroke-width="1.4" stroke-linejoin="round"/>
    <g stroke="#0c0905" stroke-width="0.6" opacity="0.6">
      <path d="M102 37 V45"/><path d="M102 71 V79"/><path d="M218 37 V45"/><path d="M218 71 V79"/>
    </g>
    <ellipse cx="102" cy="58" rx="3.3" ry="5.4" fill="url(#eye)" stroke="#0c0905" stroke-width="0.8"/>
    <ellipse cx="102" cy="58" rx="0.7" ry="4" fill="#120202"/>
    <ellipse cx="218" cy="58" rx="3.3" ry="5.4" fill="url(#eye)" stroke="#0c0905" stroke-width="0.8"/>
    <ellipse cx="218" cy="58" rx="0.7" ry="4" fill="#120202"/>
  </g>

  <g data-layer="vessel-rim" data-kind="mask">
    <use href="#hiltOutline" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity="0.95"/>
    <use href="#guardL" fill="#fff" opacity="0.45"/>
    <use href="#guardR" fill="#fff" opacity="0.45"/>
    <use href="#gripInner" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.7" filter="url(#soft)"/>
  </g>

  <!-- ===== Anguine Tribute gem (reference slot; one per tribute) ===== -->
  <g data-layer="gem-socket" data-kind="color" data-slot="gem">
    <use href="#gemSocket" fill="#060a14" stroke="#0c0905" stroke-width="2.8" stroke-linejoin="round"/>
    <use href="#gemSocket" fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M160 29 L164.5 34 L160 39 L155.5 34 Z" fill="#111b30"/>
  </g>

  <g data-layer="gem-halo" data-kind="mask" data-slot="gem">
    <use href="#gemStone" fill="#fff" filter="url(#blur4)"/>
  </g>

  <g data-layer="gem-lit" data-kind="mask" data-slot="gem">
    <path d="M160 27.5 L154.2 34 L160 34 Z" fill="#ffffff"/>
    <path d="M160 27.5 L165.8 34 L160 34 Z" fill="#dcdcdc"/>
    <path d="M154.2 34 L160 40.5 L160 34 Z" fill="#a6a6a6"/>
    <path d="M165.8 34 L160 40.5 L160 34 Z" fill="#838383"/>
    <path d="M160 30.2 L162.6 33.4 L160 35.6 L157.4 33.4 Z" fill="#fff" opacity="0.85"/>
  </g>

  <!-- ===== Rattling Coil (reference slot; one per stack) ===== -->
  <g data-layer="coil-socket" data-kind="color" data-slot="coil">
    <use href="#coilSocket" fill="#060a14" stroke="#0c0905" stroke-width="2.6" stroke-linejoin="round"/>
    <use href="#coilSocket" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <g data-layer="coil-halo" data-kind="mask" data-slot="coil">
    <use href="#coilStone" fill="#fff" filter="url(#blur2)"/>
  </g>

  <g data-layer="coil-lit" data-kind="mask" data-slot="coil">
    <path d="M160 78.4 L155.7 83 L160 83 Z" fill="#ffffff"/>
    <path d="M160 78.4 L164.3 83 L160 83 Z" fill="#d8d8d8"/>
    <path d="M155.7 83 L160 87.6 L160 83 Z" fill="#a3a3a3"/>
    <path d="M164.3 83 L160 87.6 L160 83 Z" fill="#828282"/>
  </g>
</svg>
